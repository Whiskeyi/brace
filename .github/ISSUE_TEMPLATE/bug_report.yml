name: Bug report
description: Report a reproducible problem in Brace
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Brace. Do not include secrets or personal data.
        Report security vulnerabilities through the private link in the issue chooser.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop client
        - Web application
        - Agent runtime
        - Model provider integration
        - Workspace or sandbox
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Brace version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: List the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove API keys, tokens, local paths, personal data, and production identifiers.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets, personal data, and production identifiers.
          required: true
