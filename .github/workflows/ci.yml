name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check English and Chinese README parity
        run: pnpm docs:check

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage gates
        run: pnpm test:coverage

      - name: Build desktop bundles
        run: pnpm build

  desktop-package:
    name: macOS desktop package
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop application
        run: pnpm dist

      - name: Verify signature, icon, and launch
        shell: bash
        run: |
          app_path="$(find release -maxdepth 2 -type d -name 'Brace.app' -print -quit)"
          test -n "$app_path"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_path"

          plist_path="$app_path/Contents/Info.plist"
          /usr/bin/plutil -lint "$plist_path"
          icon_file="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist_path")"
          case "$icon_file" in
            *.icns) ;;
            *) icon_file="$icon_file.icns" ;;
          esac
          packaged_icon="$app_path/Contents/Resources/$icon_file"
          test -s "$packaged_icon"
          cmp desktop/assets/base-agent.icns "$packaged_icon"

          launch_log="$RUNNER_TEMP/brace-launch.log"
          executable="$app_path/Contents/MacOS/Brace"
          "$executable" --disable-gpu >"$launch_log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            for attempt in {1..5}; do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                wait "$app_pid" 2>/dev/null || true
                return
              fi
              sleep 1
            done
            kill -KILL "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$launch_log"
            exit 1
          fi
