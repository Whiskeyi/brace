name: Feature request
description: Propose an improvement to Brace
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Large or breaking changes should be discussed here before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should Brace solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the smallest useful outcome rather than a specific implementation when possible.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Desktop client
        - Web application
        - Agent runtime
        - Model provider integration
        - Workspace or sandbox
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this feature after the scope is agreed.
